<style>
/* Layout: one centred field-card column; a dusk band at top, one question per view, a tracker line for progress */
:root{
  --bg:#eef0ea; --surface:#fbfcf8; --ink:#1c241f; --muted:#5b665e; --line:#d3d8cc;
  --ochre:#b8731d; --ochre-soft:#f3e3c8; --acacia:#3d5a3a; --acacia-soft:#dfe8da;
  --band1:#2e3d33; --band2:#7b5a2e; --on-band:#f4f1e6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Figtree", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --ink:#e9ece3; --muted:#a3ada4; --line:#2e3a32;
  --ochre:#e3a14a; --ochre-soft:#3a2c17; --acacia:#9bc08f; --acacia-soft:#223024;
  --band1:#1e2a22; --band2:#4a3519; --on-band:#efe9d9; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --ink:#e9ece3; --muted:#a3ada4; --line:#2e3a32;
  --ochre:#e3a14a; --ochre-soft:#3a2c17; --acacia:#9bc08f; --acacia-soft:#223024;
  --band1:#1e2a22; --band2:#4a3519; --on-band:#efe9d9; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5}
.band{background:linear-gradient(160deg,var(--band1) 0%,var(--band1) 55%,var(--band2) 100%); color:var(--on-band)}
.wrap{max-width:640px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.band .wrap{padding-block:28px 22px; display:flex; flex-direction:column; gap:6px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.8}
h1{font-family:var(--display); font-weight:800; font-size:clamp(30px,7vw,44px); line-height:1.02; margin:0; text-wrap:balance; letter-spacing:-.01em}
.band p{margin:0; opacity:.86; max-width:46ch}
main .wrap{padding-block:22px 48px; display:flex; flex-direction:column; gap:18px}

.tracker{display:flex; flex-direction:column; gap:8px}
.track-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:12px; color:var(--muted)}
.track{position:relative; height:10px}
.track::before{content:""; position:absolute; left:0; right:0; top:4px; border-top:2px dashed var(--line)}
.trail{position:absolute; left:0; top:4px; height:2px; background:var(--ochre); transition:width .35s ease}
.paw{position:absolute; top:-1px; width:12px; height:12px; border-radius:50%; background:var(--ochre); transform:translateX(-50%); transition:left .35s ease; box-shadow:0 0 0 4px var(--ochre-soft)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:16px}
.qnum{font-family:var(--mono); font-size:12px; color:var(--ochre); letter-spacing:.08em}
h2{font-family:var(--display); font-weight:700; font-size:clamp(21px,4.6vw,26px); line-height:1.15; margin:0; text-wrap:balance}
.opts{display:grid; gap:9px}
.opt{all:unset; box-sizing:border-box; cursor:pointer; display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-size:15.5px; line-height:1.4; transition:border-color .15s, background .15s}
@media (hover:hover){ .opt:hover{border-color:var(--ochre)} }
.opts.locked .opt{pointer-events:none}
.opt.flash{border-color:var(--ochre); background:var(--ochre-soft); animation:flash .32s ease-out}
.opt.flash .key{background:var(--ochre); border-color:var(--ochre); color:var(--surface)}
.opts.locked .opt:not(.flash){opacity:.45; transition:opacity .2s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(.98)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ .opt.flash{animation:none} }
.opt:focus-visible{outline:2px solid var(--ochre); outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--ochre); background:var(--ochre-soft)}
.key{flex:none; width:24px; height:24px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted); background:var(--surface)}
.opt[aria-pressed="true"] .key{background:var(--ochre); border-color:var(--ochre); color:var(--surface)}
.nav{display:flex; justify-content:space-between; gap:10px; align-items:center}
.btn{all:unset; box-sizing:border-box; cursor:pointer; padding:11px 18px; border-radius:999px; font-weight:600; font-size:15px; text-align:center}
.btn:focus-visible{outline:2px solid var(--ochre); outline-offset:2px}
.btn.primary{background:var(--acacia); color:var(--surface)}
.btn.ghost{color:var(--muted); border:1px solid var(--line)}
.btn[disabled]{opacity:.4; cursor:default}

/* setup */
fieldset{border:0; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; min-width:0}
legend{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:0; margin-bottom:8px}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg label{display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid var(--line); border-radius:999px; cursor:pointer; background:var(--bg); font-size:15px}
.seg input{accent-color:var(--ochre); margin:0}
.seg label:has(input:checked){border-color:var(--ochre); background:var(--ochre-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--ochre); outline-offset:2px}
.mbti-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.mbti-grid label{display:grid; place-items:center; padding:9px 0; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--bg); font-family:var(--mono); font-size:13px}
.mbti-grid input{position:absolute; opacity:0; pointer-events:none}
.mbti-grid label:has(input:checked){border-color:var(--ochre); background:var(--ochre-soft); color:var(--ink)}
.mbti-grid label:has(input:focus-visible){outline:2px solid var(--ochre); outline-offset:2px}
.mbti-grid .wide{grid-column:1 / -1; font-family:var(--body); font-size:14.5px}
.intro-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:0; padding:0; list-style:none}
.intro-list li{font-size:14px; padding:8px 10px; border-radius:8px; background:var(--acacia-soft); display:flex; flex-direction:column}
.intro-list b{font-weight:600}
.intro-list span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.small{font-size:13.5px; color:var(--muted); margin:0}

/* result */
.result-head{display:flex; flex-direction:column; gap:4px}
.big-animal{font-family:var(--display); font-weight:800; font-size:clamp(38px,10vw,60px); line-height:.95; letter-spacing:-.02em; color:var(--ochre); margin:0; text-wrap:balance}
.sw{font-family:var(--mono); font-size:13px; color:var(--muted)}
.tagline{font-family:var(--display); font-weight:600; font-size:19px; margin:0}
.result p{margin:0}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:520px){ .cols{grid-template-columns:1fr} }
.cols h3, .sub{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; font-weight:500}
.cols ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px}
.meet{border-top:1px dashed var(--line); padding-top:12px; font-size:14.5px}
.meet b{color:var(--acacia)}
.bars{display:flex; flex-direction:column; gap:8px}
.bar-row{display:grid; grid-template-columns:130px 1fr 44px; gap:10px; align-items:center; font-size:14px}
.bar-row span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--acacia); border-radius:4px}
.bar-row:first-child .bar i{background:var(--ochre)}
.pct{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.runner{background:var(--acacia-soft); border-radius:10px; padding:12px 14px; font-size:14.5px}
.radar-wrap{display:flex; justify-content:center}
.radar{width:100%; max-width:480px; height:auto}
.stat-line{display:flex; flex-direction:column; gap:2px; font-size:14.5px}
.stat-line b{font-weight:600}
.legend{display:flex; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block}
.mbti-note{font-size:14px; color:var(--muted); border-left:3px solid var(--ochre); padding-left:10px}
.share-text{width:100%; min-height:90px; font:inherit; font-size:13.5px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical}
.actions{display:flex; gap:10px; flex-wrap:wrap}
details{font-size:14px}
details summary{cursor:pointer; color:var(--acacia); font-weight:600}
details p{margin:8px 0 0; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .trail,.paw,.opt{transition:none} }
</style>

<header class="band">

</header>

/* parse "S1 L.5" strings into objects */
Q.forEach(q => q[1].forEach(o => {
  const t = {}; (o[1] || "").trim().split(/\s+/).filter(Boolean).forEach(tok => { t[tok[0]] = parseFloat(tok.slice(1)); }); o[1] = t;
}));

/* Centre each question: the average pull of its five options is removed,
   so a question set that leans social or kind overall doesn't push everyone the same way. */
const QMEAN = Q.map(q => { const m = {}; DIMS.forEach(d => m[d] = q[1].reduce((acc, o) => acc + (o[1][d] || 0), 0) / q[1].length); return m; });

const MBTI_TYPES = ["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
const MBTI_WEIGHT = 1.5;    // at most worth one and a half answers, and only on traits your answers left unclear
const SHRINK = 2;           // keeps a trait near neutral until several answers point the same way
const NUDGE = 0.025;        // direct animal nudges are small tie-breakers

function profile(ans, mbti, useMbti = true){
  const s = {}, n = {}; DIMS.forEach(d => { s[d] = 0; n[d] = 0; });
  const nudges = {}; Object.keys(A).forEach(k => nudges[k] = 0);
  ans.forEach((a, i) => {
    if (a == null) return;
    const [, t, b] = Q[i][1][a];
    DIMS.forEach(d => { const v = (t[d] || 0) - QMEAN[i][d]; s[d] += v; n[d] += Math.abs(v); });
    if (b) for (const k in b) nudges[k] += b[k];
  });
  if (useMbti && mbti && mbti.length === 4) {
    const map = [["S","E","I"],["V","N","S"],["H","F","T"],["O","J","P"]];
    map.forEach(([d, pos], i) => {
      const clarity = Math.abs(s[d]) / (n[d] + SHRINK);      // 0 = answers undecided, 1 = answers clear-cut
      const w = MBTI_WEIGHT * (1 - Math.min(1, clarity * 2)); // clear answers leave no room for MBTI
      s[d] += (mbti[i] === pos ? 1 : -1) * w; n[d] += w;
    });
  }
  const u = DIMS.map(d => s[d] / (n[d] + SHRINK));
  return {u, nudges};
}

/* Calibration: small per-animal offsets, tuned by simulating thousands of test-takers,
   so that each of the 16 animals comes out on top about equally often. Used for ranking only. */
const CAL = {"elephant":0.15,"lion":0.072,"leopard":-0.232,"rhino":-0.106,"buffalo":0.073,"cheetah":-0.139,"giraffe":-0.013,"zebra":0.028,"hippo":0.021,"hyena":0.096,"baboon":0.073,"flamingo":0.03,"wildebeest":0.04,"crocodile":-0.155,"chimpanzee":0.198,"wilddog":0.124};

function rank({u, nudges}){
  const un = Math.hypot(...u) || 1;
  return Object.keys(A).map(k => {
    const p = A[k].p, pn = Math.hypot(...p);
    const cos = u.reduce((acc, v, i) => acc + v * p[i], 0) / (un * pn);   // shape of personality
    const dist = Math.sqrt(u.reduce((acc, v, i) => acc + (v - p[i]) ** 2, 0) / DIMS.length) / 2; // 0..1
    const fit = 0.7 * cos + 0.3 * (1 - 2 * dist) + NUDGE * nudges[k];
    return {k, fit, adj: fit + CAL[k]};
  }).sort((a, b) => b.adj - a.adj);
}
const pctOf = fit => Math.max(1, Math.min(99, Math.round(50 + 50 * fit)));

function tracker(){

}

function go(i){
  if (i < 0) { state.step = "intro"; }
  else if (i >= Q.length) { state.step = state.ans.every(a => a != null) ? "result" : "q"; if (state.step === "q") state.i = state.ans.findIndex(a => a == null); }

}

/* Game-style ability radar. Each axis is the trait's high end; the centre is its opposite.
   Your trait values are stretched for display so a clear lean reads as a high or low stat. */
const STAT_LABELS = {S:"Social", V:"Vision", H:"Heart", O:"Planning", B:"Bravery", P:"Speed", F:"Playful", L:"Leadership"};
const statOf = v => Math.round(50 + 50 * Math.max(-1, Math.min(1, v)));
const youStat = v => statOf(v * 1.8);

function radar(u, p, animalName){
  const N = DIMS.length, cx = 230, cy = 166, R = 100;
  const pt = (i, val) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / N; const r = R * val / 100; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
  const poly = vals => vals.map((v, i) => pt(i, v).map(n => n.toFixed(1)).join(",")).join(" ");
  const you = u.map(youStat), ani = p.map(statOf);
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${poly(Array(N).fill(v))}" fill="none" stroke="var(--line)" stroke-width="${v === 100 ? 1.5 : 1}" ${v === 50 ? 'stroke-dasharray="3 4"' : ""}/>`).join("");
  const spokes = DIMS.map((d, i) => { const [x, y] = pt(i, 100); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`; }).join("");
  const labels = DIMS.map((d, i) => {
    const [x, y] = pt(i, 122);
    const anchor = Math.abs(x - cx) < 8 ? "middle" : (x > cx ? "start" : "end");
    const dy = y < cy - R ? -4 : (y > cy + R ? 12 : 4);
    return `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" font-size="12.5" font-family="var(--body)" fill="var(--muted)">${STAT_LABELS[d]} <tspan font-family="var(--mono)" font-weight="700" fill="var(--ochre)">${you[i]}</tspan></text>`;
  }).join("");
  const dots = you.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--ochre)"/>`; }).join("");
  const order = DIMS.map((d, i) => [d, you[i]]).sort((a, b) => b[1] - a[1]);
  const best = order.slice(0, 2).map(([d, v]) => `${STAT_LABELS[d]} ${v}`).join(", ");
  const low = order[order.length - 1][0];
  return `<div class="radar-wrap">
    <svg viewBox="0 0 460 334" class="radar" role="img" aria-label="Your trait chart. ${DIMS.map((d, i) => STAT_LABELS[d] + " " + you[i]).join(", ")}">
      ${rings}${spokes}
      <polygon points="${poly(ani)}" fill="var(--acacia)" fill-opacity="0.10" stroke="var(--acacia)" stroke-width="2" stroke-dasharray="5 4"/>
      <polygon points="${poly(you)}" fill="var(--ochre)" fill-opacity="0.28" stroke="var(--ochre)" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${labels}
    </svg></div>
    <div class="stat-line"><span><b>Top stats:</b> ${best}</span><span><b>Lowest:</b> ${STAT_LABELS[low]}, which makes you more ${DIM_LABELS[low][0].toLowerCase()}</span></div>
    <p class="small">50 is the dashed middle ring. Toward the centre means the opposite trait: solitary, practical, logical, spontaneous, cautious, calm, serious or supportive.</p>`;
}

  <section class="card">
    <h2>Your Trait</h2>
    <div class="legend"><span><i style="background:var(--ochre)"></i>You</span><span><i style="border:2px dashed var(--acacia)"></i>${esc(nameOf(k))}</span></div>
    ${radar(prof.u, a.p, nameOf(k))}
  </section>
  <section class="card">
    <h2>Your top three</h2>
    <div class="bars">${r.slice(0, 3).map(x => `<div class="bar-row"><span>${esc(nameOf(x.k))}</span><div class="bar"><i style="width:${pctOf(x.adj)}%"></i></div><span class="pct">${pctOf(x.adj)}%</span></div>`).join("")}</div>
    <details><summary>How the match works</summary>
      <p>Every answer moves you along eight personality traits, measured against the average of the five options so no trait is favoured by how the questions are written. Each animal has its own profile on the same eight traits, based on how it actually lives: herd or solitary, sprinter or ambusher, leader or team player. Your match blends how similar the overall shape of your profile is to each animal's with how close the individual traits are. A few answers, like loving water or wanting super speed, give a small extra nudge to specific animals. The scoring is calibrated so all sixteen animals are equally likely outcomes. If you gave an MBTI type, it only acts as a light tie-breaker on the Social, Visionary, Heart and Planner traits, and only where your own answers were evenly split. There is no fixed link between any MBTI type and any animal.</p>
    </details>
  </section>
  <section class="card">
    <label class="sub" for="share">Share your result</label>
    <textarea class="share-text" id="share" readonly>${esc(share)}</textarea>
    <div class="actions">
      <button class="btn primary" id="copy">Copy result</button>
      <button class="btn ghost" id="review">Review answers</button>
      <button class="btn ghost" id="again">Take it again</button>
    </div>
  </section>`;
  document.getElementById("copy").onclick = e => {
    const t = document.getElementById("share"), btn = e.currentTarget;
    const fallback = () => { t.select(); btn.textContent = "Selected, copy it"; };
    try { navigator.clipboard.writeText(t.value).then(() => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy result", 1600); }, fallback); }
    catch(err) { fallback(); }
  };
  document.getElementById("review").onclick = () => { state.step = "q"; state.i = 0; save(); render(); window.scrollTo(0, 0); };
  document.getElementById("again").onclick = () => { state = fresh(); save(); render(); window.scrollTo(0, 0); };
}

document.addEventListener("keydown", e => {
  if (state.step !== "q") return;
  const j = "abcde".indexOf(e.key.toLowerCase());
  if (j >= 0) { const b = document.getElementById("opt-" + j); if (b) b.click(); }
});

render();
</script>

</html>
